              "@type": "Answer",
              "text": "A hash turns any input into a fixed-length fingerprint. The same input always produces the same digest and any change produces a different one, so hashes are used to check that a download or message is intact, to index content, and to store passwords when combined with a salt."

            "name": "Can a hash be reversed to get the original text?",
